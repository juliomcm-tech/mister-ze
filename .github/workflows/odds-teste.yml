name: Teste da segunda fonte de odds
# Só corre à mão. Faz 2 pedidos à OddsPapi com a chave guardada em Settings → Secrets (ODDSPAPI_KEY)
# e mostra que casas e mercados vêm na resposta. Não grava nada e não mexe nas apostas.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Perguntar à OddsPapi
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: |
          cat > t.mjs <<'JS'
          const K = process.env.ODDSPAPI_KEY;
          if (!K) { console.log('FALTA A CHAVE: cria o segredo ODDSPAPI_KEY em Settings → Secrets and variables → Actions.'); process.exit(1); }
          const B = 'https://api.oddspapi.io/v4';
          const get = async (p, q) => { const u = new URL(B + p); Object.entries({ ...q, apiKey: K }).forEach(([k, v]) => u.searchParams.set(k, v)); const r = await fetch(u); const t = await r.text(); let j = null; try { j = JSON.parse(t); } catch (e) {} return { status: r.status, j, t: t.slice(0, 300).replaceAll(K, '***'), lim: [...r.headers].filter(([k]) => /limit|remaining|quota/i.test(k)) }; };
          const d = n => new Date(Date.now() + n * 864e5).toISOString().slice(0, 10);
          const f = await get('/fixtures', { sportId: 10, from: d(0), to: d(3) });
          console.log('jogos: estado', f.status, '| cabeçalhos de quota', JSON.stringify(f.lim));
          const L = Array.isArray(f.j) ? f.j : (f.j && (f.j.fixtures || f.j.data)) || [];
          if (!L.length) { console.log('sem lista de jogos. Resposta:', f.t); process.exit(1); }
          console.log('jogos nos próximos 3 dias:', L.length, '| campos de um jogo:', Object.keys(L[0]).join(', '));
          const tor = {}; L.forEach(x => { const k = x.tournamentSlug || x.tournamentName || x.tournamentId; tor[k] = (tor[k] || 0) + 1; });
          console.log('competições (30 maiores):', Object.entries(tor).sort((a, b) => b[1] - a[1]).slice(0, 30).map(([k, n]) => k + ' ' + n).join(' | '));
          const C = L.filter(x => x.hasOdds && new Date(x.startTime) > new Date());
          console.log('com odds e por jogar:', C.length, '| nations:', C.filter(x => /nations/i.test(x.tournamentSlug || '')).map(x => x.participant1Name + '-' + x.participant2Name + ' [' + x.tournamentSlug + '/' + x.categorySlug + ']').slice(0, 12).join(' ; '));
          console.log('ligas nossas:', [...new Set(C.filter(x => /portugal|england|spain|italy|germany|france|netherlands|international|europe/i.test(x.categorySlug || '')).map(x => x.categorySlug + '/' + x.tournamentSlug))].slice(0, 60).join(' | '));
          const alvo = C.find(x => /england/i.test(x.participant1Name + x.participant2Name) && /nations/i.test(x.tournamentSlug || '')) || C.find(x => /nations/i.test(x.tournamentSlug || '')) || C[0];
          console.log('jogo de teste:', JSON.stringify(alvo).slice(0, 400));
          const o = await get('/odds', { fixtureId: alvo.fixtureId || alvo.id });
          console.log('odds: estado', o.status, '| cabeçalhos de quota', JSON.stringify(o.lim));
          const bo = o.j && (o.j.bookmakerOdds || o.j.bookmakers);
          if (!bo) { console.log('sem odds. Resposta:', o.t); process.exit(1); }
          const casas = Object.keys(bo);
          console.log('casas na resposta:', casas.length, '→', casas.join(', '));
          for (const c of ['pinnacle', 'betano', 'bet365', 'betfair-ex']) { if (bo[c]) { const mk = bo[c].markets || {}; console.log('==', c, '| mercados:', Object.keys(mk).length, '| ids:', Object.keys(mk).slice(0, 40).join(','), '| exemplo:', JSON.stringify(Object.entries(mk).slice(0, 2)).slice(0, 1500)); } else console.log('==', c, 'NÃO VEM'); }
          console.log('chaves de topo da resposta:', Object.keys(o.j).join(', '));
          console.log('casas com «betano» ou «pt» no nome:', casas.filter(c => /betano|\.pt|portugal|solverde|placard|betclic/i.test(c)).join(', ') || 'nenhuma');
          JS
          node t.mjs
